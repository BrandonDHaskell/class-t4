name: toolchain

# Builds the toolchain image and pushes it to GHCR. The digest it prints is
# copied into docker/toolchain/DIGEST by hand; nothing else uses tags.

on:
  push:
    paths:
      - docker/toolchain/**
      - .github/workflows/toolchain.yml
      # Pinning the digest or editing docs must not rebuild the image.
      - "!docker/toolchain/DIGEST"
      - "!docker/toolchain/README.md"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: toolchain-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/brandondhaskell/class-t4-toolchain

jobs:
  build:
    runs-on: ubuntu-24.04
    # Two full GCC builds on a 4 vCPU runner.
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker/toolchain
          push: true
          tags: ${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=toolchain
          cache-to: type=gha,scope=toolchain,mode=max
          provenance: false

      - name: Report digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          ref="${IMAGE}@${DIGEST}"
          echo "::notice title=Toolchain digest::${ref}"
          {
            echo "## Toolchain image"
            echo
            echo "Pin this in \`docker/toolchain/DIGEST\`:"
            echo
            echo '```'
            echo "${ref}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
